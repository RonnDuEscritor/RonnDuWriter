name: Run ValueData Scraper

# Define cuándo se ejecutará el scraper
on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a la medianoche UTC
  workflow_dispatch: # Esto te permite activar el scraper manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10' # Puedes cambiar la versión si lo necesitas

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        # Si tienes un archivo requirements.txt, descomenta la siguiente línea:
        # pip install -r requirements.txt
        # Si no tienes un requirements.txt, instala las librerías directamente aquí, por ejemplo:
        # pip install requests beautifulsoup4 pandas

    - name: Ejecutar el scraper
      run: python valuedata_scraper.py
